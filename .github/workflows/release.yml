# v로 시작하는 태그(예: v0.2.0)를 올리면 릴리즈를 만든다.
# 릴리즈 파일: app.zip(프로그램), version.txt(자동 업데이트 확인용), install.ps1, PcHelper-Setup.cmd(배포용 설치 파일)
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          printf '%s' "$VERSION" > src/version.txt
          printf '%s' "$VERSION" > version.txt
          (cd src && zip -r ../app.zip .)
          git fetch --tags --force
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" app.zip version.txt install.ps1 PcHelper-Setup.cmd \
            --title "PC 도우미 $GITHUB_REF_NAME" --notes-file notes.md
